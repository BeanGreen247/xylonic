name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: lint · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # Plain `npm ci` (no --legacy-peer-deps): the lockfile records
        # @testing-library/dom & co. only as peers of @testing-library/react@16,
        # and --legacy-peer-deps skips peer-only entries → LayoutModeContext.test.tsx
        # fails with "Cannot find module '@testing-library/dom'". Plain resolution
        # against the committed lockfile is conflict-free (verified via npm ci --dry-run).
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size gate
        run: npm run size

      # Not a gate yet: ~59 pre-existing errors, mostly TS 4.9 not understanding
      # moduleResolution "bundler". Clears with the WS-PERF TypeScript 5.x bump,
      # then drop continue-on-error.
      - name: Typecheck (non-blocking)
        run: npm run typecheck
        continue-on-error: true
