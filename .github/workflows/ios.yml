name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build:
    name: Build iOS (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Write build info
        run: node scripts/write-build-info.js ${{ github.event.inputs.build_type || 'debug' }}

      - name: Build React bundle
        run: npm run build
        env:
          VITE_BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

      - name: Install CocoaPods
        run: sudo gem install cocoapods --no-document

      - name: Scaffold iOS project (first time only)
        run: |
          if [ ! -d "ios" ]; then
            echo "ios/ not found — running npx cap add ios..."
            npx cap add ios
            echo "IOS_SCAFFOLDED=true" >> $GITHUB_ENV
          else
            echo "ios/ already exists — skipping scaffold"
            echo "IOS_SCAFFOLDED=false" >> $GITHUB_ENV
          fi

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          fi

      - name: Build for Simulator (debug)
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color || true

      - name: Archive for device (release, unsigned)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Xylonic.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty --color || true

      - name: Upload iOS scaffold (if first-time)
        if: env.IOS_SCAFFOLDED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-scaffold
          path: ios/
          retention-days: 30

      - name: Upload archive (release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: Xylonic-iOS-${{ github.sha }}
          path: ${{ runner.temp }}/Xylonic.xcarchive
          retention-days: 14

      - name: Summary
        run: |
          echo "## iOS Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build type:** ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$IOS_SCAFFOLDED" = "true" ]; then
            echo "### First-time setup" >> $GITHUB_STEP_SUMMARY
            echo "The \`ios/\` project was scaffolded for the first time." >> $GITHUB_STEP_SUMMARY
            echo "Download the **ios-project-scaffold** artifact and commit it to your repo:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "# Unzip artifact into repo root, then:" >> $GITHUB_STEP_SUMMARY
            echo "git add ios/" >> $GITHUB_STEP_SUMMARY
            echo "git commit -m 'feat: add Capacitor iOS project scaffold'" >> $GITHUB_STEP_SUMMARY
            echo "git push" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install on iPhone: download artifact → open AltStore → + → select .ipa" >> $GITHUB_STEP_SUMMARY
          echo "See [IOS_SETUP.md](IOS_SETUP.md) for AltStore setup instructions." >> $GITHUB_STEP_SUMMARY
