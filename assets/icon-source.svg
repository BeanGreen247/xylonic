<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Material You surface: gentle top-to-bottom tonal shift on the circle -->
    <linearGradient id="circleFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#007D92"/>
      <stop offset="100%" stop-color="#004E60"/>
    </linearGradient>
    <!-- Very subtle top-left sheen for M3 elevation feel -->
    <radialGradient id="sheen" cx="35%" cy="30%" r="55%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Spotify-style circle (transparent outside the circle) ── -->
  <circle cx="256" cy="256" r="218" fill="url(#circleFill)"/>
  <circle cx="256" cy="256" r="218" fill="url(#sheen)"/>

  <!-- ── Eighth note (iTunes note motif, flat white) ── -->

  <!-- Note head: tilted ellipse, bottom-left of centre -->
  <ellipse cx="213" cy="352"
           rx="61" ry="47"
           transform="rotate(-15 213 352)"
           fill="#FFFFFF"/>

  <!-- Stem: rounded rectangle rising from right side of head -->
  <rect x="250" y="128" width="26" height="230" rx="13" fill="#FFFFFF"/>

  <!-- Flag: single flowing hook from stem top -->
  <path d="M 276,128 C 366,146 362,224 296,258"
        stroke="#FFFFFF" stroke-width="25"
        stroke-linecap="round" fill="none"/>
</svg>
