apply plugin: 'com.android.application'

// Read version from package.json
def packageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def appVersion = packageJson.version
def (verMajor, verMinor, verPatch) = appVersion.tokenize('.')
def computedVersionCode = verMajor.toInteger() * 10000 + verMinor.toInteger() * 100 + verPatch.toInteger()

// Load signing credentials from android/local.properties (never committed to git).
// Use distinct variable names (ks*) to avoid clashing with Groovy DSL setter names.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localProps.load(localPropsFile.newDataInputStream())

def ksFile     = localProps.getProperty('KEYSTORE_FILE')
def ksPassword = localProps.getProperty('KEYSTORE_PASSWORD')
def ksAlias    = localProps.getProperty('KEY_ALIAS')
def ksKeyPass  = localProps.getProperty('KEY_PASSWORD')
def canSign    = ksFile && ksPassword && ksAlias && ksKeyPass

android {
    namespace = "xylonic.beangreen247xyz.musicplayer"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "xylonic.beangreen247xyz.musicplayer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile     canSign ? file(ksFile) : null
            storePassword canSign ? ksPassword   : ''
            keyAlias      canSign ? ksAlias       : ''
            keyPassword   canSign ? ksKeyPass     : ''
        }
    }
    buildTypes {
        release {
            signingConfig canSign ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.palette:palette:1.0.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
