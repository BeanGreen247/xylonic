name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build:
    name: Build iOS (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Write build info
        run: node scripts/write-build-info.js ${{ github.event.inputs.build_type || 'debug' }}

      - name: Build React bundle
        run: npm run build
        env:
          VITE_BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

      - name: Install CocoaPods and xcpretty
        run: sudo gem install cocoapods xcpretty --no-document

      - name: Scaffold iOS project (first time only)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
            echo "IOS_SCAFFOLDED=true" >> $GITHUB_ENV
          else
            echo "IOS_SCAFFOLDED=false" >> $GITHUB_ENV
          fi

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          fi

      - name: Detect Xcode project type
        run: |
          if [ -f "ios/App/App.xcworkspace" ]; then
            echo "XCODE_BUILD_FLAG=-workspace" >> $GITHUB_ENV
            echo "XCODE_BUILD_PATH=ios/App/App.xcworkspace" >> $GITHUB_ENV
            echo "Detected: CocoaPods workspace"
          else
            echo "XCODE_BUILD_FLAG=-project" >> $GITHUB_ENV
            echo "XCODE_BUILD_PATH=ios/App/App.xcodeproj" >> $GITHUB_ENV
            echo "Detected: SPM project (Capacitor 8 default)"
          fi

      - name: Archive (debug)
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          set -o pipefail
          xcodebuild archive \
            $XCODE_BUILD_FLAG $XCODE_BUILD_PATH \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -archivePath $RUNNER_TEMP/Xylonic-debug.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty --color

      - name: Archive (release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          set -o pipefail
          xcodebuild archive \
            $XCODE_BUILD_FLAG $XCODE_BUILD_PATH \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Xylonic-release.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty --color

      - name: Package unsigned IPA (debug)
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$RUNNER_TEMP/Xylonic-debug.xcarchive/Products/Applications/App.app" \
                "$RUNNER_TEMP/Payload/"
          cd $RUNNER_TEMP && zip -r Xylonic-debug-unsigned.ipa Payload/
          echo "IPA_PATH=$RUNNER_TEMP/Xylonic-debug-unsigned.ipa" >> $GITHUB_ENV

      - name: Package unsigned IPA (release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$RUNNER_TEMP/Xylonic-release.xcarchive/Products/Applications/App.app" \
                "$RUNNER_TEMP/Payload/"
          cd $RUNNER_TEMP && zip -r Xylonic-release-unsigned.ipa Payload/
          echo "IPA_PATH=$RUNNER_TEMP/Xylonic-release-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xylonic-iOS-${{ github.event.inputs.build_type || 'debug' }}-unsigned-${{ github.sha }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS scaffold (if first-time)
        if: env.IOS_SCAFFOLDED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-scaffold
          path: ios/
          retention-days: 30

      - name: Summary
        run: |
          echo "## iOS Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build type:** ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          IPA=$(basename "$IPA_PATH")
          SIZE=$(du -sh "$IPA_PATH" | cut -f1)
          echo "- **IPA:** $IPA ($SIZE)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installing on your iPhone" >> $GITHUB_STEP_SUMMARY
          echo "This is an **unsigned** IPA — it needs to be signed with your Apple ID before it will run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**With Sideloadly (Linux AppImage):**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the IPA artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Open Sideloadly, drag the IPA in, plug in iPhone via USB" >> $GITHUB_STEP_SUMMARY
          echo "3. Sign in with your Apple ID — Sideloadly signs and installs in one step" >> $GITHUB_STEP_SUMMARY
          echo "4. Trust the developer on iPhone: Settings → General → VPN & Device Management" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Free Apple ID certificate expires every 7 days. Replug and re-run Sideloadly to refresh." >> $GITHUB_STEP_SUMMARY
          if [ "$IOS_SCAFFOLDED" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### First-time setup" >> $GITHUB_STEP_SUMMARY
            echo "The \`ios/\` project was scaffolded this run. Download **ios-project-scaffold** and commit it:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "git add ios/ && git commit -m 'feat: add Capacitor iOS scaffold' && git push" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
