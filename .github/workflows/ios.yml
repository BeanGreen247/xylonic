name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build:
    name: Build iOS (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Write build info
        run: node scripts/write-build-info.js ${{ github.event.inputs.build_type || 'debug' }}

      - name: Build React bundle
        run: npm run build
        env:
          VITE_BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

      - name: Install CocoaPods and xcpretty
        run: sudo gem install cocoapods xcpretty --no-document

      - name: Scaffold iOS project (first time only)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
            echo "IOS_SCAFFOLDED=true" >> $GITHUB_ENV
          else
            echo "IOS_SCAFFOLDED=false" >> $GITHUB_ENV
          fi

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Set iOS version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$PLIST"
          echo "Set iOS version to $VERSION"

      - name: Lock iPhone to portrait, keep iPad all orientations
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationPortraitUpsideDown" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationPortraitUpsideDown" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:2 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:3 string UIInterfaceOrientationLandscapeRight" "$PLIST"

      - name: Declare background audio mode
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"

      - name: Allow HTTP connections for Subsonic servers
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Xylonic needs local network access to connect to your Subsonic music server'" "$PLIST"

      - name: Inject native plugins
        run: |
          cp scripts/ios-native/BackgroundDownloadPlugin.swift ios/App/App/
          cp scripts/ios-native/BackgroundKeepAlive.swift     ios/App/App/
          cp scripts/ios-native/MainViewController.swift      ios/App/App/
          cp scripts/ios-native/AppDelegate.swift             ios/App/App/

      - name: Register native plugins in Xcode project
        run: |
          ruby - <<'RUBY'
            require 'xcodeproj'
            project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
            target  = project.targets.find { |t| t.name == 'App' }
            # Find the group that owns AppDelegate.swift — robust regardless of group name
            app_group = project.main_group.recursive_children_groups.find { |g|
              g.children.any? { |c| c.respond_to?(:path) && c.path == 'AppDelegate.swift' }
            }
            %w[
              BackgroundDownloadPlugin.swift
              BackgroundKeepAlive.swift
              MainViewController.swift
            ].each do |name|
              next if app_group.children.any? { |c| c.respond_to?(:path) && c.path == name }
              ref = app_group.new_reference(name)
              target.add_file_references([ref])
            end
            project.save
          RUBY

      - name: Point Main.storyboard at MainViewController
        run: |
          # Capacitor 8 requires custom native plugins to be explicitly registered via
          # bridge?.registerPluginInstance(...) inside capacitorDidLoad() — CAPBridgedPlugin
          # conformance alone does not register them. MainViewController.swift does this;
          # repoint the storyboard's root view controller at it instead of the stock
          # CAPBridgeViewController. See https://capacitorjs.com/docs/ios/custom-code
          STORYBOARD="ios/App/App/Base.lproj/Main.storyboard"
          sed -i 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="MainViewController"/' "$STORYBOARD"
          grep -q 'customClass="MainViewController"' "$STORYBOARD" || { echo "Failed to repoint Main.storyboard"; exit 1; }

      - name: Inject custom app icon
        run: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          cp resources/ios-icons/AppIcon.png        "$ICONSET/AppIcon.png"
          cp resources/ios-icons/AppIcon~dark.png   "$ICONSET/AppIcon~dark.png"
          cp resources/ios-icons/AppIcon~tinted.png "$ICONSET/AppIcon~tinted.png"
          cp resources/ios-icons/Contents.json      "$ICONSET/Contents.json"

      - name: Install CocoaPods dependencies
        run: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          fi

      - name: Detect Xcode project type
        run: |
          if [ -f "ios/App/App.xcworkspace" ]; then
            echo "XCODE_BUILD_FLAG=-workspace" >> $GITHUB_ENV
            echo "XCODE_BUILD_PATH=ios/App/App.xcworkspace" >> $GITHUB_ENV
            echo "Detected: CocoaPods workspace"
          else
            echo "XCODE_BUILD_FLAG=-project" >> $GITHUB_ENV
            echo "XCODE_BUILD_PATH=ios/App/App.xcodeproj" >> $GITHUB_ENV
            echo "Detected: SPM project (Capacitor 8 default)"
          fi

      - name: Archive (debug)
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          set -o pipefail
          xcodebuild archive \
            $XCODE_BUILD_FLAG $XCODE_BUILD_PATH \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -archivePath $RUNNER_TEMP/Xylonic-debug.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty --color

      - name: Archive (release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          set -o pipefail
          xcodebuild archive \
            $XCODE_BUILD_FLAG $XCODE_BUILD_PATH \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Xylonic-release.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty --color

      - name: Package unsigned IPA (debug)
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$RUNNER_TEMP/Xylonic-debug.xcarchive/Products/Applications/App.app" \
                "$RUNNER_TEMP/Payload/"
          cd $RUNNER_TEMP && zip -r Xylonic-debug-unsigned.ipa Payload/
          echo "IPA_PATH=$RUNNER_TEMP/Xylonic-debug-unsigned.ipa" >> $GITHUB_ENV

      - name: Package unsigned IPA (release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$RUNNER_TEMP/Xylonic-release.xcarchive/Products/Applications/App.app" \
                "$RUNNER_TEMP/Payload/"
          cd $RUNNER_TEMP && zip -r Xylonic-release-unsigned.ipa Payload/
          echo "IPA_PATH=$RUNNER_TEMP/Xylonic-release-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xylonic-iOS-${{ github.event.inputs.build_type || 'debug' }}-unsigned-${{ github.sha }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS scaffold (if first-time)
        if: env.IOS_SCAFFOLDED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-scaffold
          path: ios/
          retention-days: 30

      - name: Summary
        run: |
          echo "## iOS Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build type:** ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          IPA=$(basename "$IPA_PATH")
          SIZE=$(du -sh "$IPA_PATH" | cut -f1)
          echo "- **IPA:** $IPA ($SIZE)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installing on your iPhone" >> $GITHUB_STEP_SUMMARY
          echo "This is an **unsigned** IPA — it needs to be signed with your Apple ID before it will run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**With Sideloadly (Linux AppImage):**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the IPA artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Open Sideloadly, drag the IPA in, plug in iPhone via USB" >> $GITHUB_STEP_SUMMARY
          echo "3. Sign in with your Apple ID — Sideloadly signs and installs in one step" >> $GITHUB_STEP_SUMMARY
          echo "4. Trust the developer on iPhone: Settings → General → VPN & Device Management" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Free Apple ID certificate expires every 7 days. Replug and re-run Sideloadly to refresh." >> $GITHUB_STEP_SUMMARY
          if [ "$IOS_SCAFFOLDED" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### First-time setup" >> $GITHUB_STEP_SUMMARY
            echo "The \`ios/\` project was scaffolded this run. Download **ios-project-scaffold** and commit it:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "git add ios/ && git commit -m 'feat: add Capacitor iOS scaffold' && git push" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
